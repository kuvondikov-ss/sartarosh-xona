<!doctype html>
<html lang="uz" data-theme="olov">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>SartaroshXona</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="preload" as="image" href="img/bg.webp">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fon: rangli nurlar va naqsh -->
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <div class="bg-img"></div>
    <div class="pattern"></div>
  </div>

  <!-- Yuqori panel -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--a1)"/><stop offset="1" stop-color="var(--a2)"/></linearGradient></defs>
          <rect x="2" y="2" width="36" height="36" rx="11" fill="url(#lg)"/>
          <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
            <circle cx="13.5" cy="27" r="4"/><circle cx="26.5" cy="27" r="4"/>
            <path d="M16.3 24.2 27 9M23.7 24.2 13 9"/>
          </g>
        </svg>
      </span>
      <span class="brand-name">Sartarosh<b>Xona</b></span>
    </div>
    <div class="top-actions">
      <button class="pill-btn" id="myBtn" title="Navbatlarim">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span id="myCount">0</span>
      </button>
      <button class="avatar" id="avatarBtn" aria-label="Profil"></button>
    </div>
  </header>

  <main>
    <!-- ================= BOSH SAHIFA ================= -->
    <section class="view active" id="view-home">
      <div class="hero" id="hero">
        <div class="hero-track" id="heroTrack"></div>
        <div class="dots" id="heroDots"></div>
      </div>

      <div class="stats" id="stats"></div>

      <h2 class="section-title">Xizmatlar</h2>
      <div class="services" id="services"></div>

      <div class="section-head" id="mapAnchor">
        <h2 class="section-title">Xaritada</h2>
        <span class="loc-status" id="locStatus">Joylashuv aniqlanmoqda…</span>
      </div>
      <div class="map-block">
        <div class="map-card">
          <div id="map"></div>
          <button class="map-fab" id="locateBtn" aria-label="Mening joylashuvim">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
          </button>
        </div>
        <div class="near-col">
          <div class="section-head small">
            <h3>Sizga eng yaqin</h3>
            <button class="link-btn" data-goto="search">Hammasi →</button>
          </div>
          <div class="list" id="homeList"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
        </div>
      </div>
    </section>

    <!-- ================= QIDIRUV ================= -->
    <section class="view" id="view-search">
      <h1 class="page-title">Sartaroshlar</h1>
      <label class="search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Ism, sartaroshxona yoki manzil" autocomplete="off">
      </label>
      <div class="chips" id="chips">
        <button class="chip active" data-filter="all">Hammasi</button>
        <button class="chip" data-filter="open">🟢 Hozir ochiq</button>
        <button class="chip" data-filter="free">✅ Bo'sh vaqti bor</button>
        <button class="chip" data-filter="pro">⭐ 10+ yil</button>
        <button class="chip" data-filter="fav">❤️ Sevimlilar</button>
      </div>
      <div class="sortbar">
        <span id="resultCount"></span>
        <select id="sortSelect" aria-label="Saralash">
          <option value="dist">Yaqinlik bo'yicha</option>
          <option value="free">Bo'sh vaqt bo'yicha</option>
          <option value="exp">Staj bo'yicha</option>
          <option value="name">Nomi bo'yicha</option>
        </select>
      </div>
      <div class="list" id="searchList"></div>
    </section>

    <!-- ================= NAVBATLARIM ================= -->
    <section class="view" id="view-bookings">
      <h1 class="page-title">Navbatlarim</h1>
      <div class="list" id="bookingsList"></div>
    </section>

    <!-- ================= PROFIL ================= -->
    <section class="view" id="view-profile">
      <div class="profile-card" id="profileCard"></div>
      <h2 class="section-title">Mavzu ranglari</h2>
      <div class="themes" id="themes"></div>
      <h2 class="section-title">Boshqalar</h2>
      <div class="menu-list" id="profileMenu"></div>
      <p class="footnote">SartaroshXona · navbat olish xizmati</p>
    </section>
  </main>

  <!-- Pastki menyu -->
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Bosh sahifa</span>
    </button>
    <button class="tab" data-tab="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Qidiruv</span>
    </button>
    <button class="tab" data-tab="bookings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Navbatlar</span><i class="tab-badge" id="tabBadge" hidden></i>
    </button>
    <button class="tab" data-tab="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span>Profil</span>
    </button>
  </nav>

  <!-- Sartarosh oynasi (pastdan chiqadi) -->
  <div class="backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
